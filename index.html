:root[data-theme="dark"]{--bg:#0c1d2e;--card:#12293f;--txt:#dbe9f6;--h2:#7cc4f0;--soft:#173a58;--line:#25435f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background-color:var(--bg);background-image:var(--rbf);background-size:80px 80px;color:var(--txt);line-height:1.7}
header{position:relative;background:linear-gradient(135deg,#0b4f7c,#1e88c8);color:#fff;text-align:center;padding:16px 16px 26px}
header::before,header::after{content:"";position:absolute;top:70px;width:76px;height:76px;background:var(--rbw) no-repeat center/contain}
header::before{left:16px}header::after{right:16px}
.lang{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.lang button{border:0;border-radius:20px;padding:7px 14px;font:inherit;font-size:.85rem;font-weight:600;background:#fff;color:#0b4f7c;cursor:pointer}
.lang button.on{background:#0a3a5c;color:#fff;outline:2px solid #fff}
.lang button:focus-visible,.btn:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
.lg{width:112px;height:112px;background:#fff;border-radius:50%;padding:8px}
.sl{font-size:1.25rem;font-weight:700;letter-spacing:.2em;margin-top:6px}
h1{margin:8px 0 2px;font-size:1.55rem;line-height:1.25}
main{max-width:780px;margin:auto;padding:14px}
section{background:var(--card);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 2px 8px rgba(11,79,124,.14)}
h2{color:var(--h2);margin:0 0 8px;font-size:1.2rem;border-bottom:3px solid var(--acc);padding-bottom:6px}
h2::before{content:"";display:inline-block;width:28px;height:28px;margin-inline-end:10px;vertical-align:middle;background:var(--rbb) no-repeat center/contain}
.pos{background:var(--soft);border-radius:14px;padding:14px;text-align:center;font-weight:700;margin:16px 0}
.pos::before,.pos::after{content:"";display:inline-block;width:24px;height:24px;margin:0 8px;vertical-align:middle;background:var(--rbb) no-repeat center/contain}
.q{padding:10px 0;border-bottom:1px solid var(--line)}
.q label{margin-inline-end:18px;cursor:pointer}
.bm{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
input[type=number]{width:100px;padding:8px;border:1px solid #7fb3d9;border-radius:8px;background:var(--card);color:var(--txt);font:inherit}
.btn{background:#0b4f7c;color:#fff;border:0;border-radius:26px;padding:12px 28px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
#lvl{font-size:1.25rem;font-weight:700}.low{color:#1b8a3a}.mid{color:#d98200}.high{color:#d32f2f}
small{opacity:.8}
footer{text-align:center;padding:18px 16px;background:#0b4f7c;color:#fff;font-size:.9rem}
footer::before{content:"";display:block;height:44px;margin-bottom:10px;background:var(--rbw) repeat-x center/44px}
footer .lg{width:84px;height:84px;margin-bottom:6px}
@media(max-width:560px){header::before,header::after{width:38px;height:38px;top:96px}h1{font-size:1.3rem}}
